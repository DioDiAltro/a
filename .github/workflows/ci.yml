name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biglie
          POSTGRES_PASSWORD: biglie
          POSTGRES_DB: biglie
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Tests
        run: pytest --cov --cov-report=term-missing
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      # The architecture is only modular for as long as something checks, and
      # the ledger is only trustworthy for as long as it reconciles. Both are
      # blocking.
      - name: Bounded context boundaries
        run: pytest tests/test_boundaries.py -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Ledger invariants on PostgreSQL
        run: pytest wallet -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://biglie:biglie@localhost:5432/biglie
