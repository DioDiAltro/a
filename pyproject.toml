[project]
name = "biglie"
version = "0.1.0"
description = "Un marketplace dove si compra, si vende e si gioca. La valuta è la biglia."
requires-python = ">=3.11"

# Kept in step with requirements.txt, which stays for the Docker image and CI.
# Two files for the same list is a small duplication; the alternative is
# rebuilding the container layer cache on every dependency-group change.
dependencies = [
    "Django==5.0.9",
    "djangorestframework==3.15.2",
    "psycopg[binary]==3.2.3",
    "celery[redis]==5.4.0",
    "redis==5.1.1",
    "channels==4.1.0",
    "channels-redis==4.2.0",
    "daphne==4.1.2",
    "django-environ==0.11.2",
    "django-htmx==1.19.0",
    "stripe==11.1.0",
    "Pillow==10.4.0",
    "whitenoise==6.7.0",
    "django-storages==1.14.4",
    "argon2-cffi==23.1.0",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-django==4.9.0",
    "pytest-cov==5.0.0",
    "model-bakery==1.19.5",
    "ruff==0.7.2",
    "freezegun==1.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "wallet", "identity", "compliance", "games", "salemodes",
            "marketplace", "payments", "charity", "economy", "realtime", "web", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# `--ds` on the command line beats the DJANGO_SETTINGS_MODULE environment
# variable, which beats this file's ini option. Putting it in addopts is the
# only placement that survives a shell where someone exported the dev settings
# to run the server — see conftest.py for why that matters.
addopts = "--reuse-db -q --ds=config.settings.test"
testpaths = ["core", "wallet", "identity", "compliance", "games", "marketplace",
             "salemodes", "payments", "charity", "economy", "web", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "config/*"]
