[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db -q"
testpaths = ["core", "wallet", "identity", "compliance", "games", "marketplace",
             "salemodes", "payments", "charity", "economy", "web", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["E501"]

[tool.coverage.run]
omit = ["*/migrations/*", "*/tests/*", "config/*"]
